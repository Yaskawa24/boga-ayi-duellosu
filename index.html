<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17122b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Boğa Ayı Düellosu: meme coin grafiklerinde long ya da short aç, rakibini yen.">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Boğa Ayı Düellosu</title>
<style>
/* v2 · sistem fontları (harici CDN yok) */
:root{
  --bg:#17122b; --panel:#221a3d; --line:#3a2f63; --fg:#efeaff; --muted:#b0a8d4;
  --p1:#ffb340; --p2:#3fd6e8; --up:#4fd18b; --down:#ff5c6c; --warn:#ffd45c; --boss:#c58bff;
  --display:"Impact","Haettenschweiler","Arial Narrow Bold","Arial Black",system-ui,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Roboto Mono","DejaVu Sans Mono",monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none;
  background-image:radial-gradient(circle at 20% -10%,#2c2160 0,transparent 55%),radial-gradient(circle at 110% 110%,#1d2d55 0,transparent 50%);background-attachment:fixed}
input{-webkit-user-select:text;user-select:text}
.wrap{max-width:760px;margin:0 auto;padding-left:calc(14px + env(safe-area-inset-left,0px));padding-right:calc(14px + env(safe-area-inset-right,0px));padding-top:calc(62px + env(safe-area-inset-top,0px));padding-bottom:calc(28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
h1,h2,.disp{font-family:var(--display);font-weight:400;letter-spacing:.5px;text-wrap:balance;margin:0}
h1{font-size:clamp(34px,10vw,52px);line-height:1}
h1 .b{color:var(--up)} h1 .a{color:var(--down)}
.lbl{font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);font-weight:700}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sb{justify-content:space-between}
.col{display:flex;flex-direction:column;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid1{display:grid;grid-template-columns:1fr;gap:10px}
button{font-family:var(--body);font-weight:700;font-size:16px;border:0;border-radius:12px;padding:12px 14px;cursor:pointer;color:#1a1430;background:var(--fg);transition:transform .08s;min-height:44px}
button:active{transform:scale(.97)}
button:focus-visible,input:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
button:disabled{opacity:.35;cursor:not-allowed}
.big{width:100%;padding:16px;font-size:20px;font-family:var(--display);font-weight:400;letter-spacing:.8px}
.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
input{font-family:var(--body);font-size:16px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:12px;width:100%}
.p1c{color:var(--p1)} .p2c{color:var(--p2)} .bossc{color:var(--boss)} .warnc{color:var(--warn)}
.tag{display:inline-block;padding:5px 10px;border-radius:999px;font-weight:700;font-size:13px}
.r-bull{background:color-mix(in srgb,var(--up) 22%,transparent);color:var(--up)}
.r-bear{background:color-mix(in srgb,var(--down) 22%,transparent);color:var(--down)}
.r-side{background:color-mix(in srgb,var(--muted) 22%,transparent);color:var(--muted)}
.r-meme{background:color-mix(in srgb,var(--warn) 22%,transparent);color:var(--warn)}
.r-crash,.r-rug{background:color-mix(in srgb,var(--down) 35%,transparent);color:#ffd0d5}
.r-moon{background:color-mix(in srgb,var(--warn) 35%,transparent);color:#fff2c4}
.r-chaos{background:linear-gradient(90deg,color-mix(in srgb,var(--up) 30%,transparent),color-mix(in srgb,var(--down) 30%,transparent));color:var(--fg)}
.bossbadge{background:var(--boss);color:#1a1430;font-family:var(--display);font-size:13px;padding:4px 10px;border-radius:6px;letter-spacing:.5px}
.opt{display:grid;gap:8px}
.opt.c3{grid-template-columns:repeat(3,1fr)} .opt.c2{grid-template-columns:repeat(2,1fr)} .opt.c4{grid-template-columns:repeat(4,1fr)}
.opt button{background:var(--bg);color:var(--fg);border:1px solid var(--line);padding:10px 4px}
.opt button.on{color:var(--warn);border-color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,var(--bg));box-shadow:inset 0 0 0 1px var(--warn)}
.mode{display:grid;gap:8px;grid-template-columns:repeat(3,1fr)}
.mode button{background:var(--bg);color:var(--fg);border:1px solid var(--line);padding:12px 4px;display:flex;flex-direction:column;gap:4px;align-items:center;font-size:15px}
.mode button.on{color:var(--warn);border-color:var(--warn);background:color-mix(in srgb,var(--warn) 10%,var(--bg))}
.mode small{font-weight:500;font-size:12px;color:var(--muted)}
.bots{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bots button{background:var(--bg);color:var(--fg);border:1px solid var(--line);text-align:left;display:flex;flex-direction:column;gap:3px;padding:10px}
.bots button.on{border-color:var(--p2);box-shadow:inset 0 0 0 1px var(--p2)}
.bots .lvl{font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;padding:2px 7px;border-radius:6px;align-self:flex-start}
.lv-kolay{background:#4fd18b33;color:var(--up)} .lv-orta{background:#ffd45c33;color:var(--warn)} .lv-zor{background:#ff5c6c33;color:var(--down)} .lv-ali{background:#c58bff33;color:var(--boss)}
.hand{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pc{background:linear-gradient(160deg,#2d2352,#1c1636);border:1px solid var(--line);border-radius:12px;padding:10px 6px;color:var(--fg);display:flex;flex-direction:column;gap:4px;align-items:center;text-align:center;min-width:0}
.pc .ic{font-size:26px}
.pc b{font-size:14px}
.pc span{font-size:12px;font-weight:500;color:var(--muted);line-height:1.3}
.pc.on{border-color:var(--boss);box-shadow:0 0 0 2px var(--boss),0 0 22px color-mix(in srgb,var(--boss) 40%,transparent)}
.chartbox{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#120e22}
canvas.ch{display:block;width:100%;height:220px}
.chart-hud{position:absolute;left:10px;top:8px;display:flex;flex-direction:column;gap:0;pointer-events:none;background:#120e22cc;padding:4px 8px;border-radius:8px}
.count{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:80px;color:var(--warn);pointer-events:none;text-shadow:0 4px 30px #000;background:#0006}
.count.pop{animation:pop .5s}
@keyframes pop{0%{transform:scale(1.6);opacity:0}100%{transform:scale(1);opacity:1}}
.news{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92%,420px);padding:12px 14px;border-radius:12px;text-align:center;font-weight:800;font-size:17px;line-height:1.35;pointer-events:none;box-shadow:0 10px 40px #000a;animation:pop .35s}
.news.pos{background:color-mix(in srgb,var(--up) 90%,#000);color:#06210f}
.news.neg{background:color-mix(in srgb,var(--down) 92%,#000);color:#2a0308}
.news small{display:block;font-family:var(--display);font-size:13px;letter-spacing:1px;margin-bottom:4px}
/* Yön düğmeleri */
.dirs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dirbtn{padding:16px 6px;border-radius:16px;font-family:var(--display);font-weight:400;font-size:28px;letter-spacing:1px;display:flex;flex-direction:column;align-items:center;gap:2px;border:3px solid transparent;min-height:96px}
.dirbtn small{font-family:var(--body);font-size:13px;font-weight:700;letter-spacing:0;opacity:.9}
.dirbtn .ar{font-size:30px;line-height:1}
.dirbtn.long{background:color-mix(in srgb,var(--up) 18%,var(--bg));color:var(--up);border-color:color-mix(in srgb,var(--up) 45%,transparent)}
.dirbtn.short{background:color-mix(in srgb,var(--down) 18%,var(--bg));color:var(--down);border-color:color-mix(in srgb,var(--down) 45%,transparent)}
.dirbtn.long.on{background:var(--up);color:#052b14;border-color:#fff;box-shadow:0 0 26px color-mix(in srgb,var(--up) 60%,transparent)}
.dirbtn.short.on{background:var(--down);color:#36040b;border-color:#fff;box-shadow:0 0 26px color-mix(in srgb,var(--down) 60%,transparent)}
.dirs.has .dirbtn:not(.on){opacity:.5}
.passbtn{width:100%;background:transparent;color:var(--muted);border:1px dashed var(--line);font-size:15px}
.passbtn.on{color:var(--fg);border-style:solid;border-color:var(--fg)}
.levv{font-family:var(--display);font-size:40px;line-height:1}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:36px;background:transparent;padding:0;border:0}
input[type=range]::-webkit-slider-runnable-track{height:10px;border-radius:5px;background:linear-gradient(90deg,var(--up),var(--warn) 55%,var(--down))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:#fff;margin-top:-10px;box-shadow:0 2px 10px #0008;border:3px solid var(--bg)}
input[type=range]::-moz-range-track{height:10px;border-radius:5px;background:linear-gradient(90deg,var(--up),var(--warn) 55%,var(--down))}
input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:#fff;border:3px solid var(--bg)}
input.plain[type=range]::-webkit-slider-runnable-track{background:var(--line)}
input.plain[type=range]::-moz-range-track{background:var(--line)}
.ticks{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-family:var(--mono);padding:0 4px}
.sum{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:15px;line-height:1.5}
.sum b{font-family:var(--mono)}
.tip{width:24px;height:24px;min-height:24px;padding:0;border-radius:50%;font-size:13px;background:var(--line);color:var(--fg);margin-left:6px;vertical-align:middle}
.tbar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.tbar i{display:block;height:100%;width:100%;background:var(--warn);transition:width .25s linear}
.tbar.hot i{background:var(--down)}
/* Yarış HUD */
.pl{border-radius:14px;padding:10px;border:2px solid var(--line);display:flex;flex-direction:column;gap:4px;min-width:0;background:var(--panel)}
.pl.p1{border-color:color-mix(in srgb,var(--p1) 60%,var(--line))}
.pl.p2{border-color:color-mix(in srgb,var(--p2) 60%,var(--line))}
.pl .pnl{font-size:26px;font-weight:800;line-height:1.1}
.dirb{font-family:var(--display);font-size:14px;padding:3px 8px;border-radius:6px;letter-spacing:.5px}
.dirb.long{background:var(--up);color:#052b14} .dirb.short{background:var(--down);color:#36040b} .dirb.flat{background:var(--line);color:var(--fg)}
.btns{display:grid;grid-template-columns:1fr 2fr;gap:6px;margin-top:4px}
.closebtn{padding:16px 4px;font-family:var(--display);font-weight:400;font-size:19px;letter-spacing:.5px}
.addbtn{padding:16px 2px;font-size:14px;background:var(--bg);color:var(--fg);border:1px solid var(--line)}
.p1 .closebtn{background:var(--p1)} .p2 .closebtn{background:var(--p2)}
.up{color:var(--up)} .down{color:var(--down)}
.status{font-size:14px;font-weight:700;min-height:19px}
.liq{color:var(--down);animation:flash .5s 3}
@keyframes flash{50%{opacity:.2}}
.shake{animation:shake .45s}
@keyframes shake{20%{transform:translate(-8px,3px)}40%{transform:translate(7px,-4px)}60%{transform:translate(-5px,2px)}80%{transform:translate(4px,-1px)}}
#flash{position:fixed;inset:0;pointer-events:none;background:var(--down);opacity:0;z-index:8;transition:opacity .35s}
#cf{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(64px + env(safe-area-inset-top,0px));z-index:25;width:min(92vw,460px);background:var(--boss);color:#1a1430;font-weight:700;padding:12px 16px;border-radius:12px;text-align:center;box-shadow:0 10px 30px #0008;line-height:1.4}
@media (prefers-reduced-motion:reduce){.liq,.shake,.count.pop,.news{animation:none}button{transition:none}}
.scorebar{display:flex;justify-content:space-between;align-items:center;gap:8px}
.scorebar .who{display:flex;flex-direction:column;min-width:0}
.dots{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;max-width:150px}
.dots i{width:11px;height:11px;border-radius:3px;background:var(--line)}
.dots i.boss{border:1px solid var(--boss)}
.dots i.w1{background:var(--p1)} .dots i.w2{background:var(--p2)} .dots i.d{background:var(--muted)} .dots i.l{background:var(--down)} .dots i.cur{outline:2px solid var(--fg)}
.cover{min-height:60vh;display:grid;place-items:center;text-align:center}
.headline{font-size:17px;line-height:1.45;font-weight:500}
.rules li{margin-bottom:6px;line-height:1.5}
.small{font-size:14px;color:var(--muted);line-height:1.45}
table{width:100%;border-collapse:collapse}
td,th{padding:7px 4px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
td:last-child,th:last-child{text-align:right}
.cmp td:nth-child(2){text-align:center}
.titles{display:grid;gap:8px}
.ttl{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:10px;background:var(--bg);border:1px solid var(--line)}
.share{white-space:pre-wrap;font-family:var(--mono);font-size:13px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;-webkit-user-select:all;user-select:all}
.topbtns{position:fixed;right:calc(10px + env(safe-area-inset-right,0px));top:calc(10px + env(safe-area-inset-top,0px));z-index:11;display:flex;gap:8px}
.topbtns button{width:44px;height:44px;padding:0;border-radius:50%;background:var(--panel);color:var(--fg);border:1px solid var(--line);font-size:19px}
.why{background:var(--bg);border-left:4px solid var(--line);border-radius:8px;padding:10px 12px;font-size:15px;line-height:1.5}
.why.good{border-color:var(--up)} .why.bad{border-color:var(--down)}
.tier{display:inline-flex;align-items:center;gap:6px;font-weight:800;padding:4px 10px;border-radius:999px;font-size:14px}
.t-Bronz{background:#cd7f3233;color:#e8a46a} .t-Gümüş{background:#c0c0c033;color:#e3e3ee} .t-Altın{background:#ffd45c33;color:var(--warn)} .t-Platin{background:#3fd6e833;color:var(--p2)} .t-Elmas{background:#c58bff33;color:#e2c6ff}
.achs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.ach{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;gap:8px;align-items:flex-start}
.ach .ic{font-size:24px}
.ach.lock{opacity:.4;filter:grayscale(1)}
.ach b{font-size:14px;display:block}
.ach span{font-size:12px;color:var(--muted)}
/* Öğretici */
#coach{position:fixed;inset:0;z-index:20}
#coach .hole{position:fixed;border-radius:12px;box-shadow:0 0 0 9999px rgba(8,5,20,.8);border:3px solid var(--warn);pointer-events:none;transition:all .2s}
#coach .bub{position:fixed;left:12px;right:12px;max-width:460px;margin:0 auto;background:var(--panel);border:2px solid var(--warn);border-radius:14px;padding:14px;font-size:16px;line-height:1.5;box-shadow:0 10px 40px #000}
/* Ayarlar penceresi */
#modal{position:fixed;inset:0;z-index:22;background:#0009;display:grid;place-items:center;padding:16px}
#modal .card{width:min(100%,440px);max-height:90vh;overflow:auto}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.sw{width:56px;min-height:32px;height:32px;padding:0;border-radius:16px;background:var(--line);position:relative}
.sw::after{content:"";position:absolute;left:4px;top:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on{background:var(--up)} .sw.on::after{left:28px}
details summary{cursor:pointer;font-weight:700}

/* ===== OYUN HİSSİ: neon arena ===== */
body{background:#0b0718}
#bg{position:fixed;inset:0;z-index:-1;width:100%;height:100%;pointer-events:none}
.card{background:linear-gradient(180deg,#241a45f0,#1b1436f0);box-shadow:0 0 0 1px #ffffff08 inset,0 8px 24px #0006}
.chartbox{border-color:#5b44c9;box-shadow:0 0 22px #6a4cff40,inset 0 0 40px #6a4cff22;background:linear-gradient(180deg,#140f2b,#0e0a1f)}
.big{position:relative;overflow:hidden;box-shadow:0 6px 0 rgba(0,0,0,.4),0 0 18px #ffd45c33;text-shadow:0 1px 0 #fff6}
.big::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,#ffffff55,transparent);animation:shine 3s infinite;pointer-events:none}
@keyframes shine{0%{left:-60%}55%,100%{left:130%}}
.big:active:not(:disabled){transform:translateY(4px) scale(.985);box-shadow:0 2px 0 rgba(0,0,0,.4)}
.dirbtn{transition:transform .12s cubic-bezier(.2,1.6,.4,1)}
.dirbtn.on{transform:scale(1.04)} .dirbtn:active{transform:scale(.93)}
.closebtn{box-shadow:0 5px 0 rgba(0,0,0,.4)}
.closebtn:not(:disabled){animation:glowp 1.1s infinite}
.closebtn:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.4)}
@keyframes glowp{50%{filter:brightness(1.18);box-shadow:0 5px 0 rgba(0,0,0,.4),0 0 24px #ffd45caa}}
h1,h2{text-shadow:0 0 18px color-mix(in srgb,currentColor 40%,transparent)}
.arena{position:relative;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;padding:10px 10px 8px;border-radius:16px;background:radial-gradient(ellipse at 50% 120%,#ff5c6c33,transparent 60%),linear-gradient(180deg,#2a1d5a,#160f33);border:1px solid #5b44c9;box-shadow:0 0 24px #6a4cff44}
.fighter{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.ava{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font-size:36px;line-height:1;background:radial-gradient(circle at 35% 30%,#ffffff33,transparent 60%),var(--c);box-shadow:0 0 0 3px var(--c),0 0 20px var(--c);position:relative;animation:idle 2.2s ease-in-out infinite;will-change:transform}
.ava.p1{--c:color-mix(in srgb,var(--p1) 65%,#1a1430)} .ava.p2{--c:color-mix(in srgb,var(--p2) 55%,#1a1430)} .ava.mk{--c:color-mix(in srgb,var(--down) 55%,#1a1430)}
@keyframes idle{50%{transform:translateY(-4px)}}
.ava.cheer{animation:cheer .5s ease-in-out infinite}
@keyframes cheer{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-11px) rotate(-9deg) scale(1.06)}60%{transform:translateY(-4px) rotate(9deg)}}
.ava.hurt{animation:hurt .28s linear infinite;filter:saturate(.6) brightness(.85)}
@keyframes hurt{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.ava.ko{filter:grayscale(1) brightness(.55);transform:rotate(90deg);animation:none}
.ava .emo{position:absolute;right:-10px;top:-10px;font-size:22px;filter:drop-shadow(0 2px 2px #000)}
.hp{width:100%;height:12px;border-radius:6px;background:#0009;border:1px solid #ffffff30;overflow:hidden}
.hp i{display:block;height:100%;transition:width .3s;background:linear-gradient(90deg,#2fbf6f,#b6ffd6);box-shadow:0 0 10px #4fd18b}
.hp.mid i{background:linear-gradient(90deg,#e0a800,#fff1b8);box-shadow:0 0 10px var(--warn)} .hp.low i{background:linear-gradient(90deg,#d8243a,#ffb0b8);box-shadow:0 0 10px var(--down)}
.fname{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:1px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fbal{font-family:var(--mono);font-size:13px;font-weight:800}
.vs{font-family:var(--display);font-size:32px;color:var(--warn);text-shadow:0 0 12px var(--warn),0 0 30px #ff5c6c;animation:vsp 1.4s ease-in-out infinite}
@keyframes vsp{50%{transform:scale(1.12)}}
#vsov{position:fixed;inset:0;z-index:19;background:radial-gradient(circle at 50% 45%,#3a238aee,#0b0718f8 70%);overflow:hidden}
#vsov::before{content:"";position:absolute;inset:-50%;background:repeating-conic-gradient(from 0deg,#ffffff08 0 8deg,transparent 8deg 16deg);animation:spin 12s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#vsov .side{position:absolute;top:26%;display:flex;flex-direction:column;align-items:center;gap:10px;width:42%}
#vsov .l{left:4%;animation:inL .55s cubic-bezier(.2,1.4,.4,1) both} #vsov .r{right:4%;animation:inR .55s cubic-bezier(.2,1.4,.4,1) both}
#vsov .ava{width:108px;height:108px;font-size:64px}
#vsov .bvs{position:absolute;left:0;right:0;top:30%;text-align:center;font-family:var(--display);font-size:92px;color:var(--warn);text-shadow:0 0 20px var(--warn),0 0 60px var(--down),0 6px 0 #000;animation:slam .45s .45s cubic-bezier(.2,1.6,.4,1) both}
#vsov .info{position:absolute;left:16px;right:16px;bottom:20%;text-align:center;animation:fadeUp .4s .75s both}
#vsov .info h2{font-size:44px}
@keyframes inL{from{transform:translateX(-170%)}} @keyframes inR{from{transform:translateX(170%)}}
@keyframes slam{from{transform:scale(4) rotate(-14deg);opacity:0}}
@keyframes fadeUp{from{transform:translateY(30px);opacity:0}}
#vsov.out{animation:fo .3s forwards} @keyframes fo{to{opacity:0}}
.callout{position:fixed;left:50%;top:36%;z-index:26;font-family:var(--display);font-size:clamp(46px,14vw,76px);white-space:nowrap;pointer-events:none;letter-spacing:1px;-webkit-text-stroke:2px #1a1430;text-shadow:0 0 22px currentColor,0 6px 0 #1a1430;animation:co 1.4s cubic-bezier(.2,1.5,.4,1) forwards}
.callout small{display:block;text-align:center;font-size:.36em;-webkit-text-stroke:0;color:#fff}
@keyframes co{0%{transform:translate(-50%,-50%) scale(.2) rotate(-10deg);opacity:0}18%{transform:translate(-50%,-50%) scale(1.15) rotate(-4deg);opacity:1}30%{transform:translate(-50%,-50%) scale(1) rotate(-4deg)}80%{opacity:1}100%{transform:translate(-50%,-85%) scale(1) rotate(-4deg);opacity:0}}
.count{font-size:120px;background:#0007;text-shadow:0 0 20px var(--warn),0 0 50px var(--down),0 6px 0 #000}
.shk{animation:shk .25s}
@keyframes shk{25%{transform:translate(-4px,2px)}50%{transform:translate(4px,-2px)}75%{transform:translate(-2px,1px)}}
.trophy{font-size:100px;text-align:center;line-height:1.1;animation:tro 1s cubic-bezier(.2,1.6,.4,1) both;filter:drop-shadow(0 0 26px var(--warn))}
@keyframes tro{from{transform:scale(0) rotate(-30deg)}}
.reward{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rw{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.rw b{font-family:var(--display);font-size:30px;display:block;color:var(--warn);text-shadow:0 0 12px #ffd45c88}
.xpbar{height:16px;border-radius:8px;background:#0009;overflow:hidden;border:1px solid #ffffff25}
.xpbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--boss),var(--p2));box-shadow:0 0 14px var(--boss);transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.lvchip{display:inline-flex;gap:6px;align-items:center;font-weight:800;font-size:13px;color:var(--fg)}
@media (prefers-reduced-motion:reduce){.ava,.vs,.big::after,.closebtn,#vsov::before,.trophy,.callout{animation:none!important}}
</style>

<body style="margin:0">
<div class="topbtns"><button id="mute" aria-label="Sesi aç/kapat">🔊</button><button id="gear" aria-label="Ayarlar">⚙️</button></div>
<canvas id="bg"></canvas>
<div id="flash"></div>
<canvas id="cf"></canvas>
<div id="toast" hidden></div>
<div class="wrap" id="app"></div>
<script>
"use strict";
// ===== KAYIT =====
const ST={k:'ba2',d:{},
 load(){try{this.d=JSON.parse(localStorage.getItem(this.k))||{};}catch(e){this.d={};}
  const def={xp:0,lvl:1,coins:0,vol:.8,sfx:.9,mus:.5,muted:false,music:true,hap:true,timer:25,tutDone:false,rating:1000,peak:1000,games:0,wins:0,mstreak:0,bestMStreak:0,ach:{},lb:[],daily:{}};
  for(const k in def)if(this.d[k]===undefined)this.d[k]=def[k];
  try{if(localStorage.getItem('ba_mute')==='1'&&!localStorage.getItem(this.k))this.d.muted=true;
   for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith('ba_best_')){const dt=k.slice(8),v=+localStorage.getItem(k);if(!(this.d.daily[dt]>=v))this.d.daily[dt]=v;}}}catch(e){}},
 save(){try{localStorage.setItem(this.k,JSON.stringify(this.d));}catch(e){}}};
ST.load();const P=ST.d;

// ===== SES: Web Audio sentezi (harici dosya yok) =====
const AU={ctx:null,tense:false,step:0,nextT:0,
 init(){
  if(this.ctx){if(this.ctx.state!=='running')this.ctx.resume();return;}
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  try{this.ctx=new AC();}catch(e){return;}
  const c=this.ctx;
  this.master=c.createGain();this.master.gain.value=0;
  const comp=c.createDynamicsCompressor();comp.threshold.value=-12;comp.ratio.value=4;comp.attack.value=.003;comp.release.value=.2;
  this.master.connect(comp);comp.connect(c.destination);
  this.sfxBus=c.createGain();this.sfxBus.connect(this.master);
  this.musBus=c.createGain();this.musBus.gain.value=0;this.musBus.connect(this.master);
  this.delay=c.createDelay(1);this.delay.delayTime.value=.27;const fb=c.createGain();fb.gain.value=.32;const dl=c.createBiquadFilter();dl.type='lowpass';dl.frequency.value=2600;
  this.delay.connect(dl);dl.connect(fb);fb.connect(this.delay);const dOut=c.createGain();dOut.gain.value=.45;dl.connect(dOut);dOut.connect(this.sfxBus);
  const len=c.sampleRate;this.nbuf=c.createBuffer(1,len,c.sampleRate);const d=this.nbuf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
  this.mf=c.createBiquadFilter();this.mf.type='lowpass';this.mf.frequency.value=900;this.mf.Q.value=2;this.mf.connect(this.musBus);
  this.nextT=c.currentTime+.15;setInterval(()=>this.sched(),40);
  if(c.state!=='running')c.resume();
  this.applyVol();
 },
 applyVol(){if(!this.ctx)return;const t=this.ctx.currentTime;
  this.master.gain.setTargetAtTime(P.muted?0:P.vol,t,.05);this.sfxBus.gain.setTargetAtTime(P.sfx,t,.05);
  this.musBus.gain.setTargetAtTime(P.music?P.mus*.5:0,t,.4);
  document.getElementById('mute').textContent=P.muted?'🔇':'🔊';},
 // --- müzik: Am–F–C–G döngüsü, gerilimde hızlanır ---
 sched(){const c=this.ctx;if(c.state!=='running'||!P.music||P.muted){this.nextT=c.currentTime+.1;return;}
  const sp=60/(this.tense?128:90)/4;
  if(this.nextT<c.currentTime-.2)this.nextT=c.currentTime+.05;
  while(this.nextT<c.currentTime+.25){this.playStep(this.step,this.nextT,sp);this.nextT+=sp;this.step=(this.step+1)%64;}},
 playStep(s,t,sp){const CH=[[57,60,64],[53,57,60],[48,52,55],[55,59,62]],ch=CH[Math.floor(s/16)],b=s%16,mf=m=>440*Math.pow(2,(m-69)/12);
  if(b===0)ch.forEach((m,i)=>{this.mnote(mf(m),sp*16,'sawtooth',.018,t,.5,true);this.mnote(mf(m)*1.004,sp*16,'sawtooth',.014,t,.6,true);});
  if(b%4===0||(this.tense&&b%2===0))this.mnote(mf(ch[0]-24),sp*(this.tense?1.7:3.5),'triangle',.15,t,.01);
  if(b%2===0&&(this.tense||b%4===0||Math.random()<.3)){const arp=[0,1,2,1,2,0,1,2];this.mnote(mf(ch[arp[(b/2)%8]]+12+(b>=8&&this.tense?12:0)),sp*1.8,'triangle',.03,t,.005);}
  if(this.tense){if(b%4===0)this.kick(t,.22);if(b%4===2)this.hat(t,.035);if(b===12)this.hat(t,.06,.12);}
  else if(b===8)this.hat(t,.015,.2);},
 mnote(f,dur,type,vol,t,att,pad){const c=this.ctx,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+att);g.gain.setTargetAtTime(0,t+dur*.7,dur*.15);
  o.connect(g);g.connect(pad?this.mf:this.musBus);o.start(t);o.stop(t+dur+.5);},
 kick(t,v,bus){const c=this.ctx,o=c.createOscillator(),g=c.createGain();o.frequency.setValueAtTime(130,t);o.frequency.exponentialRampToValueAtTime(40,t+.18);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.connect(g);g.connect(bus||this.musBus);o.start(t);o.stop(t+.35);},
 hat(t,v,dur=.04){const c=this.ctx,s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=this.nbuf;f.type='highpass';f.frequency.value=7000;
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(f);f.connect(g);g.connect(this.musBus);s.start(t,Math.random()*.5);s.stop(t+dur+.02);},
 setTense(on){if(!this.ctx)return;this.tense=on;const t=this.ctx.currentTime;this.mf.frequency.cancelScheduledValues(t);this.mf.frequency.setTargetAtTime(on?1900:900,t,.6);},
 // --- efekt yardımcıları ---
 tone(f,dur,type,vol,when,o={}){const c=this.ctx,os=c.createOscillator(),g=c.createGain();os.type=type||'sine';os.frequency.setValueAtTime(f,when);
  if(o.slide)os.frequency.exponentialRampToValueAtTime(o.slide,when+dur);if(o.det)os.detune.value=o.det;
  const a=o.att||.006;g.gain.setValueAtTime(0,when);g.gain.linearRampToValueAtTime(vol,when+a);g.gain.exponentialRampToValueAtTime(.0001,when+dur);
  os.connect(g);g.connect(this.sfxBus);if(o.echo)g.connect(this.delay);os.start(when);os.stop(when+dur+.05);},
 nz(dur,vol,when,o={}){const c=this.ctx,s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=this.nbuf;s.loop=true;
  f.type=o.type||'lowpass';f.frequency.setValueAtTime(o.f||1200,when);if(o.fEnd)f.frequency.exponentialRampToValueAtTime(o.fEnd,when+dur);f.Q.value=o.q||1;
  g.gain.setValueAtTime(o.rise?0.0001:vol,when);if(o.rise)g.gain.exponentialRampToValueAtTime(vol,when+dur);else g.gain.exponentialRampToValueAtTime(.0001,when+dur);
  s.connect(f);f.connect(g);g.connect(this.sfxBus);s.start(when);s.stop(when+dur+.05);},
 sfx(k,arg){if(!this.ctx||P.muted||this.ctx.state!=='running')return;const t=this.ctx.currentTime+.005,T=this.tone.bind(this),N=this.nz.bind(this);
  switch(k){
   case'click':T(1400,.035,'triangle',.07,t);T(700,.05,'sine',.05,t);break;
   case'long':[523,659,784,1047].forEach((f,i)=>T(f,.16,'triangle',.09,t+i*.045,{echo:i===3}));T(196,.3,'sine',.14,t,{slide:392});break;
   case'short':[1047,784,659,523].forEach((f,i)=>T(f,.16,'triangle',.09,t+i*.045,{echo:i===3}));T(392,.32,'sawtooth',.05,t,{slide:150});break;
   case'pass':T(392,.1,'sine',.08,t);T(392,.12,'sine',.06,t+.11);break;
   case'dial':{const lv=arg||1,f=320+Math.log2(lv)*150;T(f,.04,'square',.035,t);N(.025,.08,t,{type:'highpass',f:5000});if(lv>=25)T(f/2,.08,'sawtooth',.04,t);}break;
   case'chart':T(arg>=0?1568:1175,.03,'sine',.02,t);break;
   case'beep':{const f=[880,660,550,440][arg]||440;T(f,.22,'square',.06,t);T(f/2,.3,'sine',.14,t);N(.5,.05,t,{type:'bandpass',f:800,fEnd:3000,q:4,rise:1});}break;
   case'go':[523,659,784,1047].forEach(f=>T(f,.5,'sawtooth',.045,t,{echo:1}));this.kick(t,.5,this.sfxBus);N(.4,.12,t,{type:'highpass',f:1000,fEnd:8000});break;
   case'tick':T(arg?2000:1500,.04,'square',arg?.06:.035,t);break;
   case'news':[1175,880,1175,1568].forEach((f,i)=>T(f,.13,'square',.06,t+i*.09));T(110,.5,'sawtooth',.08,t,{slide:55});N(.3,.15,t,{type:'bandpass',f:2500,q:2});break;
   case'liq':this.kick(t,.9,this.sfxBus);T(440,1.2,'sawtooth',.2,t,{slide:30});T(220,1.3,'square',.1,t+.02,{slide:25,det:20});N(1.4,.55,t,{f:3000,fEnd:80});[0,.12,.24].forEach(d=>T(160-d*200,.15,'square',.08,t+.4+d));break;
   case'profit':{const r=Math.max(0,arg||0),n=Math.min(8,2+Math.floor(r*4)),sc=[0,4,7,12,16,19,24,28],base=659*(1+Math.min(r,2)*.15);
    for(let i=0;i<n;i++)T(base*Math.pow(2,sc[i]/12),.3,'triangle',.08+Math.min(.06,r*.03),t+i*.055,{echo:1});
    N(.08,.06,t,{type:'highpass',f:6000});if(r>=1)[0,.08,.16].forEach(d=>T(2637,.1,'sine',.04,t+n*.055+d,{echo:1}));}break;
   case'loss':T(330,.35,'triangle',.11,t,{slide:220});T(247,.45,'triangle',.09,t+.16,{slide:150});break;
   case'shield':T(880,.5,'sine',.12,t,{slide:440,echo:1});N(.3,.1,t,{type:'bandpass',f:1500,q:5});break;
   case'win':[523,659,784,1047].forEach((f,i)=>{T(f,.4,'triangle',.11,t+i*.1,{echo:1});T(f*1.5,.3,'sine',.03,t+i*.1);});break;
   case'lose':[392,370,349,262].forEach((f,i)=>T(f,i===3?.8:.25,'triangle',.1,t+i*.22));break;
   case'draw':[440,440].forEach((f,i)=>T(f,.3,'triangle',.1,t+i*.2));break;
   case'card':T(660,.5,'sine',.12,t,{slide:1320,echo:1});[1760,2093,2637].forEach((f,i)=>T(f,.12,'sine',.04,t+.15+i*.06,{echo:1}));break;
   case'add':T(520,.15,'triangle',.12,t,{slide:780});T(1040,.1,'sine',.04,t+.08);break;
   case'bonus':[784,988,1175,1568,1976].forEach((f,i)=>T(f,.3,'triangle',.1,t+i*.07,{echo:1}));break;
   case'ach':[1047,1319,1568,2093].forEach((f,i)=>T(f,.35,'sine',.08,t+i*.08,{echo:1}));N(.6,.05,t,{type:'highpass',f:8000});break;
   case'boss':T(55,1.8,'sawtooth',.22,t,{slide:41,echo:1});T(110,1.6,'square',.07,t,{slide:82});this.kick(t,.7,this.sfxBus);this.kick(t+.45,.5,this.sfxBus);break;
   case'vs':N(.5,.25,t,{type:'bandpass',f:400,fEnd:4000,q:2,rise:1});this.kick(t+.45,.9,this.sfxBus);T(80,.8,'sawtooth',.18,t+.45,{slide:40});N(.6,.35,t+.45,{f:2500,fEnd:120});T(1568,.3,'square',.04,t+.75,{echo:1});break;
   case'coin':[1976,2637].forEach((f,i)=>T(f,.12,'square',.035,t+i*.06));break;
   case'lvl':[523,659,784,1047,1319,1568,2093].forEach((f,i)=>T(f,.4,'triangle',.08,t+i*.07,{echo:1}));this.kick(t,.5,this.sfxBus);break;
   case'fanfare':{const seq=[[523,.12],[659,.12],[784,.12],[1047,.36],[784,.12],[1047,.6]];let d=0;seq.forEach(([f,l])=>{T(f,l+.2,'sawtooth',.05,t+d,{echo:1});T(f,l+.2,'square',.03,t+d,{det:8});d+=l;});
    [262,330,392].forEach(f=>T(f,1.6,'triangle',.06,t+.72));this.kick(t,.5,this.sfxBus);this.kick(t+.72,.6,this.sfxBus);N(1.2,.05,t+.72,{type:'highpass',f:6000});}break;
  }},
};
const unlockAudio=()=>{AU.init();};
['pointerdown','touchend','keydown'].forEach(ev=>document.addEventListener(ev,unlockAudio,{capture:true,passive:true}));
document.addEventListener('visibilitychange',()=>{if(!AU.ctx)return;if(document.hidden)AU.ctx.suspend();else AU.ctx.resume();});
document.getElementById('mute').textContent=P.muted?'🔇':'🔊';
document.getElementById('mute').onclick=()=>{AU.init();P.muted=!P.muted;ST.save();AU.applyVol();};
document.getElementById('gear').onclick=()=>{AU.init();AU.sfx('click');openSettings();};
document.addEventListener('click',e=>{const b=e.target.closest('button');if(b&&!b.disabled&&!b.closest('.topbtns')&&!b.dataset.d&&!b.classList.contains('closebtn')&&!b.classList.contains('addbtn')&&!b.classList.contains('cb'))AU.sfx('click');},true);

// ===== GÖRSEL EFEKTLER =====
const RM=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
const FX={parts:[],run:false,
 vibrate(ms){if(!P.hap)return;try{navigator.vibrate&&navigator.vibrate(ms);}catch(e){}},
 liq(){const a=document.getElementById('app');if(!RM){a.classList.remove('shake');void a.offsetWidth;a.classList.add('shake');}
  const f=document.getElementById('flash');f.style.opacity=.45;setTimeout(()=>f.style.opacity=0,180);this.vibrate([200,60,200]);},
 confetti(n=90){if(RM)return;const cv=document.getElementById('cf'),W=innerWidth,H=innerHeight,dpr=devicePixelRatio||1;
  cv.width=W*dpr;cv.height=H*dpr;const cols=['#ffb340','#3fd6e8','#4fd18b','#ffd45c','#c58bff','#ff5c6c'];
  for(let i=0;i<n;i++)this.parts.push({x:W/2+(Math.random()-.5)*W*.5,y:H*.35,vx:(Math.random()-.5)*9,vy:-Math.random()*10-3,r:Math.random()*6+3,c:cols[i%cols.length],a:Math.random()*6,life:110});
  if(!this.run){this.run=true;const ctx=cv.getContext('2d');
   const step=()=>{ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
    this.parts.forEach(p=>{p.life--;
     if(p.k==='spark'){p.vx*=.94;p.vy=p.vy*.94+.12;p.x+=p.vx;p.y+=p.vy;ctx.globalAlpha=Math.max(0,p.life/60);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();ctx.globalAlpha=1;return;}
     p.vy+=.28;p.x+=p.vx;p.y+=p.vy;p.a+=.2;
     if(p.k==='coin'){const w=Math.abs(Math.cos(p.a))*p.r+1;ctx.fillStyle='#ffd45c';ctx.beginPath();ctx.ellipse(p.x,p.y,w,p.r,0,0,7);ctx.fill();ctx.fillStyle='#c98a00';ctx.beginPath();ctx.ellipse(p.x,p.y,w*.55,p.r*.55,0,0,7);ctx.fill();return;}
     ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.fillStyle=p.c;ctx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);ctx.restore();});
    this.parts=this.parts.filter(p=>p.life>0&&p.y<H+40);
    if(this.parts.length)requestAnimationFrame(step);else{ctx.clearRect(0,0,W,H);this.run=false;}};
   requestAnimationFrame(step);}}
};
let toastT;const toastQ=[];
// Fazladan efektler: parçacık, yazı patlaması, sarsıntı
Object.assign(FX,{
 burst(x,y,kind,n){if(RM)return;const cv=document.getElementById('cf'),W=innerWidth,H=innerHeight,dpr=devicePixelRatio||1;
  if(!this.run){cv.width=W*dpr;cv.height=H*dpr;}
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=kind==='boom'?2+Math.random()*9:3+Math.random()*6;
   this.parts.push(kind==='coin'?{k:'coin',x,y,vx:Math.cos(a)*v*.7,vy:-Math.abs(Math.sin(a))*v-4,r:7+Math.random()*4,a:Math.random()*6,life:80}
    :{k:'spark',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,r:2+Math.random()*4,c:['#ff5c6c','#ffb340','#ffd45c','#fff'][i%4],life:40+Math.random()*30});}
  this.confetti(0);},
 at(el){const r=el?el.getBoundingClientRect():{left:innerWidth/2,top:innerHeight/2,width:0,height:0};return [r.left+r.width/2,r.top+r.height/2];},
 callout(txt,col,sub){if(RM&&false)return;document.querySelectorAll('.callout').forEach(e=>e.remove());const d=document.createElement('div');d.className='callout';d.style.color=col;d.innerHTML=txt+(sub?`<small>${sub}</small>`:'');document.body.appendChild(d);setTimeout(()=>d.remove(),1450);},
 shk(el){if(RM||!el)return;el.classList.remove('shk');void el.offsetWidth;el.classList.add('shk');},
 flashC(col,o=.3){const f=document.getElementById('flash');f.style.background=col;f.style.opacity=o;setTimeout(()=>{f.style.opacity=0;},140);}
});
function toast(msg,ms=2600){const t=document.getElementById('toast');t.innerHTML=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,ms);}

// ===== HAREKETLİ ARKA PLAN: yıldızlar + paralaks neon şehir =====
const BG={sp:1,
 init(){const cv=document.getElementById('bg');this.cv=cv;this.ctx=cv.getContext('2d');this.size();addEventListener('resize',()=>this.size());
  let last=0;const loop=ts=>{requestAnimationFrame(loop);if(document.hidden)return;const dt=Math.min(50,ts-last);last=ts;this.draw(ts,dt);};
  if(RM){this.draw(0,0);}else requestAnimationFrame(loop);},
 size(){const dpr=Math.min(2,devicePixelRatio||1),W=innerWidth,H=innerHeight;this.W=W;this.H=H;this.cv.width=W*dpr;this.cv.height=H*dpr;this.ctx.setTransform(dpr,0,0,dpr,0,0);

function hashStr(s){let h=2166136261;for(const ch of s){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function gauss(){let u=0,v=0;while(!u)u=R();while(!v)v=R();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};

function genSeries(r,stageIdx,boss){
 const m=1+stageIdx*0.025, n=HIST+FUT, p=[100];
 const twist=HIST+Math.floor(FUT*(0.3+R()*0.45));
 const squeezes=[HIST+8+Math.floor(R()*20),HIST+35+Math.floor(R()*25)];
 let chaosR=R()<.5?"bull":"bear";
 let news=null;
 if(boss||R()<.6){const pos=R()<(r==="bear"||r==="crash"||r==="rug"?.35:.55);
  news={tick:HIST+15+Math.floor(R()*40),pos,mag:.08+R()*.08,text:(pos?NEWS.pos:NEWS.neg)[Math.floor(R()*5)]};}
 const pend=new Array(n+8).fill(0);
 for(let i=1;i<n;i++){
  let mu=0,sg=.01,jump=0,last=p[i-1],rr=r;
  if(r==="chaos"){ if(i%14===0) chaosR=chaosR==="bull"?"bear":"bull"; rr=chaosR; }
  if(rr==="bull"){mu=.0042;sg=.009*m; if(R()<.03)jump=-.025;}
  else if(rr==="bear"){mu=-.0035;sg=.019*m; if(squeezes.includes(i)) jump=.07+R()*.06;}
  else if(rr==="side"){mu=(100-last)/100*.08;sg=.012*m;}
  else if(rr==="meme"){ if(i<twist){mu=.011;sg=.022*m;} else {mu=-.028;sg=.03*m; if(i===twist)jump=-.12;} }
  else if(rr==="crash"){ if(i<twist){mu=.0015;sg=.005*m;} else {mu=-.006;sg=.022*m; if(i===twist)jump=-.16-R()*.08;} }
  else if(rr==="rug"){ if(i<twist){mu=.014;sg=.02*m;} else {mu=-.01;sg=.025*m; if(i===twist)jump=-.5-R()*.1;} }
  else if(rr==="moon"){mu=.02;sg=.04*m; if(R()<.05)jump=-.1-R()*.06;}
  if(news&&i===news.tick)jump+=news.pos?news.mag:-news.mag;
  // şoklar birkaç muma yayılır (haber 4, büyük sıçramalar 3, küçükler 2)
  if(jump){const k=Math.abs(jump)>.1?(news&&i===news.tick?4:3):2;for(let j=0;j<k;j++)pend[i+j]+=jump/k;}
  const ret=Math.max(-.7,mu+sg*.78*gauss()+pend[i]);
  p.push(Math.max(.5,last*(1+ret)));
 }
 return {p,news};
}

// ===== GRAFİK =====
function draw(cv,p,upto,opt={}){
 const dpr=window.devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;
 cv.width=W*dpr;cv.height=H*dpr;const c=cv.getContext('2d');c.scale(dpr,dpr);
 const total=opt.total||p.length, vis=p.slice(0,upto),RW=56;
 let lo=Math.min(...vis),hi=Math.max(...vis);
 if(opt.entry!=null){lo=Math.min(lo,p[opt.entry]);hi=Math.max(hi,p[opt.entry]);}
 (opt.lines||[]).forEach(l=>{if(l.fit&&l.v>lo-(hi-lo)*.6&&l.v<hi+(hi-lo)*.6){lo=Math.min(lo,l.v);hi=Math.max(hi,l.v);}});
 const pad=(hi-lo)*.12||2;lo-=pad;hi+=pad;
 const X=i=>6+(W-12-RW)*i/(total-1), Y=v=>H-12-(H-24)*(v-lo)/(hi-lo);
 c.strokeStyle='rgba(164,156,200,.12)';c.lineWidth=1;
 for(let k=1;k<5;k++){const y=H*k/5;c.beginPath();c.moveTo(0,y);c.lineTo(W-RW,y);c.stroke();}
 if(opt.dimFrom!=null){c.fillStyle='rgba(197,139,255,.1)';c.fillRect(X(opt.dimFrom),0,W-X(opt.dimFrom),H);}
 const hline=(v,col,lab,dash)=>{c.font='700 11px system-ui,sans-serif';let y=Y(v),edge='';if(y<2){y=10;edge='↑ ';}else if(y>H-2){y=H-10;edge='↓ ';}
  c.setLineDash(dash?[6,5]:[]);c.strokeStyle=col;c.lineWidth=edge?0:1.5;if(!edge){c.beginPath();c.moveTo(0,y);c.lineTo(W-RW,y);c.stroke();}c.setLineDash([]);c.lineWidth=1;
  const txt=edge+lab+' '+pxf(v),tw=c.measureText(txt).width+8,tx=Math.max(2,W-RW-tw-4);
  c.fillStyle='rgba(18,14,34,.85)';c.fillRect(tx,y-8,tw,16);c.fillStyle=col;c.fillText(txt,tx+4,y+4);};
 if(opt.entry!=null){c.setLineDash([3,4]);c.strokeStyle='rgba(255,212,92,.45)';c.beginPath();c.moveTo(X(opt.entry),0);c.lineTo(X(opt.entry),H);c.stroke();c.setLineDash([]);}
 const step=2,cw=Math.max(2,(W-12-RW)/(total/step)*.62);
 for(let i=0;i+1<upto;i+=step){
  const seg=p.slice(i,Math.min(i+step+1,upto));if(seg.length<2)break;
  const o=seg[0],cl=seg[seg.length-1],h=Math.max(...seg),l=Math.min(...seg),x=X(i+step/2);
  c.globalAlpha=opt.dimFrom!=null&&i>=opt.dimFrom?.6:1;
  const col=cl>=o?'#4fd18b':'#ff5c6c';c.strokeStyle=col;c.fillStyle=col;
  c.beginPath();c.moveTo(x,Y(h));c.lineTo(x,Y(l));c.stroke();
  const y1=Y(Math.max(o,cl)),y2=Y(Math.min(o,cl));c.fillRect(x-cw/2,y1,cw,Math.max(1.5,y2-y1));
 }
 c.globalAlpha=1;
 if(upto>1){const tc=opt.entry!=null?(p[upto-1]>=p[opt.entry]?'#7dffb5':'#ff8a96'):'#c9b8ff';c.save();c.strokeStyle=tc;c.lineWidth=2;c.shadowColor=tc;c.shadowBlur=12;c.globalAlpha=.85;c.beginPath();
  const s0=Math.max(0,opt.entry!=null?opt.entry:0);c.moveTo(X(s0),Y(p[s0]));for(let i=s0+1;i<upto;i++)c.lineTo(X(i),Y(p[i]));c.stroke();
  c.globalAlpha=1;c.fillStyle='#fff';c.shadowBlur=18;c.beginPath();c.arc(X(upto-1),Y(p[upto-1]),4,0,7);c.fill();c.restore();}
 (opt.lines||[]).forEach(l=>hline(l.v,l.col,l.lab,l.dash));
 if(opt.entry!=null)hline(p[opt.entry],'#ffd45c','Giriş',false);
 // son fiyat etiketi
 const lv=p[upto-1],ly=Math.max(9,Math.min(H-9,Y(lv))),up=opt.entry!=null?lv>=p[opt.entry]:lv>=p[0];
 c.fillStyle=up?'#4fd18b':'#ff5c6c';c.fillRect(W-RW+2,ly-9,RW-4,18);c.fillStyle='#120e22';c.font='800 12px ui-monospace,monospace';c.fillText(pxf(lv),W-RW+6,ly+4);
 (opt.marks||[]).forEach(m=>{const x=X(m.i),y=Y(p[m.i]);c.fillStyle=m.col;c.beginPath();c.arc(x,y,6,0,7);c.fill();
  c.font='800 12px system-ui,sans-serif';c.fillText(m.t,Math.min(x+8,W-RW-30),Math.max(12,y-8));});
}

function botPick(i){
 const p=S.series,st=stg(),slope=p[HIST-1]/p[HIST-9]-1,hand=S.cards[i],lvl=S.bot;let card=null,pk;
 const mode=(lvl==='zor'&&Math.random()<.1)?'orta':lvl;
 if(mode==='kolay'){const r=Math.random();pk={dir:r<.55?'long':r<.8?'short':'flat',lev:pickOne([1,3,5]),stk:pickOne([25,50]),tp:50,sl:0};if(hand.length&&Math.random()<.3)card=pickOne(hand);}
 else if(mode==='ali'){pk={dir:Math.random()<.7?'long':'short',lev:pickOne([25,50]),stk:50,tp:0,sl:0};if(hand.length&&Math.random()<.4)card=pickOne(hand);}
 else if(mode==='orta'){pk={dir:Math.abs(slope)<.02?'flat':slope>0?'long':'short',lev:pickOne([5,10]),stk:50,tp:100,sl:60};if(hand.length&&Math.random()<.4)card=pickOne(hand);}
 else{ // zor: piyasa tipine göre plan
  const plan={bull:['long',10,50,100,30],bear:['short',3,50,0,60],side:[slope>.03?'short':slope<-.03?'long':'flat',3,25,50,30],meme:['long',5,50,50,30],
   crash:['short',3,50,0,0],rug:['short',2,50,0,0],moon:['long',3,50,200,0],chaos:[slope>0?'long':'short',3,25,50,30]}[st.r];
  pk={dir:plan[0],lev:plan[1],stk:plan[2],tp:plan[3],sl:plan[4]};
  if(S.bal[i]<S.bal[0]*.7&&pk.dir!=='flat'){pk.stk=100;}   // gerideyse risk alır
  if(S.bal[i]>S.bal[0]*1.6&&S.stage>S.stages.length-4){pk.stk=25;pk.lev=Math.min(pk.lev,3);} // öndeyse korur
  if(hand.includes('insider'))card='insider';
  else if(hand.includes('double')&&(st.r==='bull'||st.r==='moon'||st.boss))card='double';
  else if(hand.includes('whale')&&pk.dir!=='flat'&&st.boss)card='whale';
  else if(hand.includes('shield')&&pk.lev>=10)card='shield';
  else if(hand.includes('fud')&&st.boss&&Math.random()<.6)card='fud';
 }
 const fut=card==='insider'?p[HIST+9]/p[HIST-1]-1:null;
 if(fut!=null){pk.dir=Math.abs(fut)<.01?'flat':fut>0?'long':(mode==='kolay'?'flat':'short');if(mode==='zor'&&Math.abs(fut)>.05)pk.lev=Math.min(10,Math.max(pk.lev,5));}
 if(card==='whale'&&pk.dir==='flat')card=null;
 pk.card=card;pk.margin=pk.dir==='flat'?0:Math.floor(S.bal[i]*pk.stk/100);
 if(pk.margin<1)pk.dir='flat';
 S.pick[i]=pk;
}

function applyCards(){
 const msgs=[],p=S.series,np=NP();
 for(let i=0;i<np;i++){const pk=S.pick[i];if(!pk.card)continue;
  S.cards[i]=S.cards[i].filter(k=>k!==pk.card);S.stats[i].cards++;
  const who=esc(S.names[i]);
  if(pk.card==='whale'&&pk.dir!=='flat'){const sg=pk.dir==='long'?1:-1;
   for(let t=HIST;t<p.length;t++){const k=Math.min(1,(t-HIST+1)/5);p[t]*=1+sg*.05*k;}
   msgs.push(`🐋 ${who} balina oldu: fiyat ${sg>0?'yukarı':'aşağı'} itiliyor!`);}
  if(pk.card==='fud'&&np===2){const o=S.pick[1-i];if(o.dir!=='flat'){o.lev=Math.max(1,Math.floor(o.lev/2));}
   msgs.push(`📉 ${who} FUD yaydı: ${esc(S.names[1-i])} kaldıracı yarıya indi!`);}
  if(pk.card==='shield')msgs.push(`🛡 ${who} kalkan taktı.`);
  if(pk.card==='double')msgs.push(`✨ ${who} çifte kâr kartını açtı.`);
  if(pk.card==='insider')msgs.push(`🔮 ${who} içeriden bilgi aldı.`);
 }
 if(msgs.length){toast(msgs.join("<br>"),3200);AU.sfx('card');}
}

function runRace(){
 applyCards();
 const p=S.series,e=HIST-1,cv=$('#cv'),np=NP(),st0=stg();
 const st=[...Array(np).keys()].map(i=>{const pk=S.pick[i];const d=pk.dir==='long'?1:-1;
  return {...pk,d,open:pk.dir!=='flat',units:pk.dir==='flat'?0:pk.margin*pk.lev/p[e],avg:p[e],pnl:0,adds:0,note:pk.dir==='flat'?'Pas geçti':'',mark:null,why:null,peak:0,closeT:null};});
 st.forEach((s,i)=>{if(s.open){S.stats[i].levSum+=s.lev;S.stats[i].levN++;S.stats[i].opened++;if(s.dir==='short')S.stats[i].shorts++;}});
 st.forEach((s,i)=>{const el=$('#lev'+i);if(el)el.textContent=s.lev;});
 const value=(s,t)=>s.units*(p[t]-s.avg)*s.d;
 const liqP=s=>s.avg-s.d*.9*s.margin/s.units;
 let t=e,timer;
 const freeBal=i=>S.bal[i]-st[i].margin;
 const upd=i=>{const s=st[i],el=$('#pnl'+i);el.textContent=sfmt(s.pnl);el.className='pnl num '+(s.pnl>0?'up':s.pnl<0?'down':'');
  const pp=$('#pp'+i);if(pp&&s.margin)pp.textContent=pct(s.pnl/s.margin)+' teminat';
  const lq=$('#lq'+i);if(lq)lq.textContent=s.open?pxf(liqP(s)):'—';
  const ad=$('#ad'+i);if(ad)ad.disabled=!s.open||s.adds>=2||freeBal(i)<10;};
 const lines=()=>st.map((s,i)=>s.open?{v:liqP(s),col:i?'#7fe6f2':'#ff8a6c',lab:(np===2?(i?'P2 ':'P1 '):'')+'Likit',dash:1,fit:!isBot(i)||np===1}:null).filter(Boolean)
   .concat(st.map((s,i)=>s.open&&s.tp&&!isBot(i)?{v:s.avg+s.d*(s.tp/100)*s.margin/s.units,col:'#4fd18b',lab:(np===2?(i?'P2 ':'P1 '):'')+'Kâr al',dash:1}:null).filter(Boolean));
 const closeP=(i,why)=>{const s=st[i];if(!s.open)return;s.open=false;s.why=why;s.closeT=t;const v=value(s,t);
  if(why==='liq'){
   if(s.card==='shield'){s.pnl=-s.margin*.3;s.note='Likide oluyordu, kalkan kurtardı 🛡';$('#st'+i).textContent='🛡 Kalkan kurtardı!';AU.sfx('shield');if(i===0&&!isBot(i))unlock('shield');}
   else{s.pnl=-s.margin;s.note=`Likide oldu (${s.lev}x)`;$('#st'+i).innerHTML='<span class="liq">💀 LİKİDE OLDU!</span>';AU.sfx('liq');FX.liq();S.stats[i].liqs++;if(i===0)unlock('liq');}
   s.mark={i:t,col:'#ff5c6c',t:'💀'};{const [x,y]=FX.at($('#av'+i));FX.burst(x,y,'boom',60);react(i,'ko');FX.callout(s.card==='shield'?'KALKAN!':'LİKİDE!',s.card==='shield'?'#c58bff':'#ff5c6c',esc(S.names[i]));FX.shk(document.getElementById('app'));}
  }else{
   s.pnl=Math.max(-s.margin,v);
   s.note={end:'Etap sonunda kapandı',manual:'Erken kapattı',tp:'Kâr al tetiklendi',sl:'Zarar kes tetiklendi'}[why];
   $('#st'+i).textContent={end:'Süre doldu',manual:'Kapattı ✓',tp:'🎯 Kâr alındı',sl:'Zarar kesildi'}[why];
   s.mark={i:t,col:i?'#3fd6e8':'#ffb340',t:i?'P2':'P1'};
   if(why!=='end'){if(v>0)AU.sfx('profit',v/s.margin);else AU.sfx('loss');}
   if(v>0){const [x,y]=FX.at($('#hud'+i));FX.burst(x,y,'coin',Math.min(40,8+Math.round(v/s.margin*20)));react(i,'win');
    if(why!=='end'&&!isBot(i))FX.callout(v>=s.margin?'MEGA KÂR!':'KÂR!',v>=s.margin?'#ffd45c':'#4fd18b',sfmt(v));if(v>=s.margin)FX.confetti(50);}
   else if(why!=='end')react(i,'hurt');
   if(why==='end'&&v>0)S.stats[i].holds++;
  }
  const b=$('#cl'+i);if(b)b.disabled=true;upd(i);};
 const addP=i=>{const s=st[i];if(!s.open||s.adds>=2)return;const amt=Math.floor(Math.min(freeBal(i),S.bal[i]*.25));if(amt<10)return;
  const nu=amt*s.lev/p[t];s.avg=(s.units*s.avg+nu*p[t])/(s.units+nu);s.units+=nu;s.margin+=amt;s.adds++;S.stats[i].adds++;
  $('#mg'+i).textContent=fmt(s.margin);$('#st'+i).textContent=`+${fmt(amt)} eklendi`;AU.sfx('add');s.pnl=value(s,t);upd(i);};
 for(let i=0;i<np;i++){const c=$('#cl'+i),a=$('#ad'+i);if(c)c.onclick=()=>closeP(i,'manual');if(a)a.onclick=()=>addP(i);}
 const total=p.length-1-e;
 const redraw=()=>draw(cv,p,t+1,{total:p.length,entry:e,lines:lines(),marks:st.map(s=>s.mark).filter(Boolean)});
 redraw();st.forEach((s,i)=>upd(i));
 const cd=$('#count');
 const startCd=()=>{AU.setTense(true);BG.sp=4;let n=3;
  const tickCd=()=>{cd.classList.remove('pop');void cd.offsetWidth;cd.classList.add('pop');
   if(n>0){cd.textContent=n;AU.sfx('beep',n);FX.vibrate(30);n--;setTimeout(tickCd,650);}else{cd.textContent='SAVAŞ!';AU.sfx('go');FX.flashC('#ffd45c',.25);setTimeout(()=>{cd.hidden=true;go();},420);}};
  setTimeout(tickCd,S.pick.some(x=>x.card)?900:200);};
 if(needCoach('race')){S.coached.race=1;cd.hidden=true;Coach.run(TUT.race,()=>{P.tutDone=true;ST.save();unlock('tut');cd.hidden=false;startCd();});}else startCd();
 function botLive(i){const s=st[i];if(!s.open)return;const r=s.pnl/s.margin;s.peak=Math.max(s.peak,r);
  if(S.bot==='orta'&&r>.6&&(p[t]-p[t-3])*s.d<0)closeP(i,'manual');
  else if(S.bot==='zor'){const drop=(p[t]/p[t-3]-1)*s.d;
   if((s.peak>.35&&r<s.peak*.7)||r>1.6||(r>.1&&drop<-.035)||(r<-.5&&drop<-.02))closeP(i,'manual');
   else if(r>.25&&s.adds<1&&drop>0&&['bull','moon'].includes(st0.r)&&Math.random()<.05)addP(i);}
  else if(S.bot==='ali'&&r>.3&&s.adds<2&&Math.random()<.08)addP(i);}
 function go(){for(let i=0;i<np;i++){const c=$('#cl'+i);if(c&&st[i].open)c.disabled=false;upd(i);}
  timer=setInterval(()=>{if(!document.body.contains(cv)){clearInterval(timer);return;}t++;
   if(S.news&&t===S.news.tick){const nw=$('#news');nw.className='news '+(S.news.pos?'pos':'neg');nw.innerHTML=`<small>⚡ SON DAKİKA</small>${esc(S.news.text)}`;nw.hidden=false;AU.sfx('news');FX.flashC(S.news.pos?'#4fd18b':'#ff5c6c',.35);FX.shk($('#cbox'));FX.vibrate(120);setTimeout(()=>{if(nw)nw.hidden=true;},3000);}
   {const mv=p[t]/p[t-1]-1,m2=p[t]/p[t-2]-1;if(Math.abs(mv)>.035){FX.shk($('#cbox'));FX.flashC(mv>0?'#4fd18b':'#ff5c6c',.18);FX.vibrate(25);}
    st.forEach((s,i)=>{if(!s.open)return;react(i,m2*s.d>.003?'cheer':m2*s.d<-.003?'hurt':'idle');setHp(i,S.bal[i]+s.pnl);
     const rr=s.pnl/s.margin;if(!isBot(i)&&!s.rocket&&rr>=1){s.rocket=1;FX.callout('ROKET! 🚀','#ffd45c','teminat ×2');AU.sfx('bonus');}});
    if(np===1)react(1,m2*st[0].d<-.003?'cheer':m2*st[0].d>.003?'hurt':'idle');}
   for(let i=0;i<np;i++){const s=st[i];if(!s.open)continue;s.pnl=value(s,t);const r=s.pnl/s.margin;
    if(r<=-.9)closeP(i,'liq');else if(s.tp&&r>=s.tp/100)closeP(i,'tp');else if(s.sl&&r<=-s.sl/100)closeP(i,'sl');else{upd(i);if(isBot(i))botLive(i);}}
   $('#px').textContent=pxf(p[t]);const ch=p[t]/p[e]-1;const pc=$('#pxc');pc.textContent=pct(ch);pc.className='num small '+(ch>=0?'up':'down');
   const pr=$('#prog i');if(pr)pr.style.width=Math.max(0,100*(1-(t-e)/total))+'%';const pt=$('#progt');if(pt)pt.textContent=Math.ceil((total-(t-e))*TICK_MS/1000)+' sn';
   if((t-e)%2===0)AU.sfx('chart',p[t]-p[t-3]);
   redraw();
   if(t>=p.length-1||st.every(s=>!s.open)){clearInterval(timer);BG.sp=1;
    for(let i=0;i<np;i++)closeP(i,'end');setTimeout(()=>finish(st,t),1200);}
  },TICK_MS);}
}

function explain(s,pnl,endMv){const a=x=>'%'+Math.abs(x*100).toFixed(1),dirTxt=s.dir==='long'?'<b class="up">long</b>':'<b class="down">short</b>';
 const mvTxt=m=>m>=0?`${a(m)} yükseldi`:`${a(m)} düştü`;
 if(s.dir==='flat')return `Pas geçtin. Fiyat bu etapta ${mvTxt(endMv)}.`+(Math.abs(endMv)>.1?' Doğru yönü seçseydin iyi kazanabilirdin.':' Akıllıca bir bekleyiş.');
 const at=S.series[s.closeT]/S.series[HIST-1]-1;
 switch(s.why){
  case'liq':return `${s.lev}x kaldıraçta fiyatın sana karşı yaklaşık %${(90/s.lev).toFixed(1)} gitmesi yetiyordu. ${dirTxt} açtın, fiyat ${mvTxt(at)} ve likidasyon çizgisine değdi.`+(s.card==='shield'?' Kalkan kaybın çoğunu kurtardı.':' Daha düşük kaldıraç ya da zarar kes bunu önlerdi.');
  case'tp':return `${dirTxt} doğru çıktı: fiyat ${mvTxt(at)} ve kâr al hedefin (+%${s.tp}) otomatik tetiklendi.`;
  case'sl':return `Fiyat sana karşı gitti (${mvTxt(at)}). Zarar kes (−%${s.sl}) devreye girip daha büyük kaybı önledi.`;
  case'manual':return pnl>0?`${dirTxt} açtın, fiyat ${mvTxt(at)} olunca kapattın ve kârı cebe koydun.`+(Math.abs(endMv)>Math.abs(at)&&endMv*s.d>at*s.d?' Biraz daha tutsan daha çok kazanırdın.':' Zamanlama iyiydi!'):`Fiyat ${mvTxt(at)}; ${dirTxt} pozisyonu zararda kapattın.`;
  default:return endMv*s.d>0?`Doğru tahmin: ${dirTxt} açtın, fiyat ${mvTxt(endMv)}. Pozisyon etap sonuna kadar açık kaldı.`:`Ters yön: ${dirTxt} açtın ama fiyat ${mvTxt(endMv)}. Kâr al / zarar kes ya da erken kapatma kaybı azaltabilirdi.`;
 }}

function finish(st,endTick){
 const np=NP(),boss=stg().boss,bonus=[],endMv=S.series[endTick]/S.series[HIST-1]-1;
 const res=st.map((s,i)=>{let raw=s.pnl,note=s.note;
  if(raw>0){let m=1;if(s.card==='double'){m*=2;note+=' · ✨×2';}if(boss){m*=2;note+=' · patron ×2';}raw*=m;}
  return {pnl:Math.round(raw),note,ex:explain(s,raw,endMv)};});
 res.forEach((r,i)=>{S.bal[i]=Math.max(0,S.bal[i]+r.pnl);if(r.pnl>S.stats[i].best)S.stats[i].best=r.pnl;if(st[i].dir!=='flat'&&r.pnl>0)S.stats[i].hits++;});
 if(np===2){const [a,b]=res.map(r=>r.pnl);const w=a===b?-1:a>b?0:1;S.wins[S.stage]=w;
  if(w===-1)S.streak=[0,0];else{S.streak[w]++;S.streak[1-w]=0;S.stats[w].stageW++;}}
 else{const v=res[0].pnl;S.wins[S.stage]=v>0?0:v<0?-2:-1;S.streak[0]=v>0?S.streak[0]+1:0;if(v>0)S.stats[0].stageW++;}
 for(let i=0;i<np;i++)if(S.streak[i]>0&&S.streak[i]%3===0){S.bal[i]+=STREAK_BONUS;bonus.push(`🔥 ${esc(S.names[i])} üst üste ${S.streak[i]} etap kazandı: +${fmt(STREAK_BONUS)} bonus!`);}
 // başarımlar (cihaz sahibi = 1. oyuncu)
 const s0=st[0],r0=res[0];
 if(s0.dir!=='flat'&&r0.pnl>0){if(s0.lev>=50)unlock('x50');if(r0.pnl>=1000)unlock('big');if(stg().r==='bear'&&s0.dir==='short')unlock('bear');}
 if(S.streak[0]>=3)unlock('s3');
 const bk=S.bal.findIndex(b=>b<1);
 S.bankrupt=bk>=0?bk:null;
 S.over=bk>=0||S.stage===S.stages.length-1;
 if(S.over){grantRewards();matchOver();}
 S.last={res,bonus,endTick,marks:st.map(s=>s.mark).filter(Boolean),move:endMv};
 AU.setTense(false);
 S.screen='result';render();
 if(bonus.length){AU.sfx('bonus');toast(bonus.join("<br>"));FX.confetti(70);FX.callout('SERİ x3!','#c58bff','+'+fmt(STREAK_BONUS));}
 else AU.sfx(np===2?(S.wins[S.stage]===-1?'draw':S.wins[S.stage]===0||S.mode==='duo'?'win':'lose'):(res[0].pnl>0?'win':res[0].pnl<0?'lose':'draw'));
 if(!S.over)flushAch();
}
function grantRewards(){const won=NP()===1?S.bal[0]>1000:S.bal[0]>S.bal[1];const s=S.stats[0];
 const xp=Math.min(400,s.stageW*25+(won?120:40)+Math.max(0,Math.round((S.bal[0]-1000)/20))+(S.mode==='bot'&&won&&S.bot==='zor'?80:0));
 const coins=Math.max(5,Math.round(S.bal[0]/50));const from={lvl:P.lvl,xp:P.xp};
 P.xp+=xp;P.coins+=coins;let up=0;while(P.xp>=P.lvl*300){P.xp-=P.lvl*300;P.lvl++;up++;}
 S.reward={xp,coins,from,up,won};}
function addLB(score,opp){P.lb.push({s:Math.round(score),o:opp,d:today()});P.lb.sort((a,b)=>b.s-a.s);P.lb=P.lb.slice(0,10);}
function animRewards(){const r=S.reward;if(!r)return;const bar=$('#xpb');if(!bar)return;const need=l=>l*300;
 bar.style.transition='none';bar.style.width=(100*r.from.xp/need(r.from.lvl))+'%';void bar.offsetWidth;bar.style.transition='';
 let n=0;const cn=$('#rwc'),cx=$('#rwx');const tk=setInterval(()=>{n++;if(cn)cn.textContent='+'+Math.round(r.coins*n/20);if(cx)cx.textContent='+'+Math.round(r.xp*n/20);if(n%4===0)AU.sfx('coin');if(n>=20)clearInterval(tk);},45);
 if(r.up){setTimeout(()=>{bar.style.width='100%';},60);setTimeout(()=>{bar.style.transition='none';bar.style.width='0%';void bar.offsetWidth;bar.style.transition='';bar.style.width=(100*P.xp/need(P.lvl))+'%';
   const l=$('#lvn');if(l)l.textContent=P.lvl;FX.callout('SEVİYE '+P.lvl+'!','#3fd6e8','seviye atladın');AU.sfx('lvl');FX.confetti(90);},1350);}
 else setTimeout(()=>{bar.style.width=(100*P.xp/need(P.lvl))+'%';},60);}
function matchOver(){
 if(NP()===1){S.newBest=false;const old=P.daily[S.date]||0;if(S.bal[0]>old){P.daily[S.date]=Math.round(S.bal[0]);S.newBest=true;}
  addLB(S.bal[0],'📅 Günlük');unlock('daily');if(S.bal[0]>=2000)unlock('d2k');ST.save();return;}
 if(S.mode!=='bot'||S.tutorial){ST.save();return;}
 const [a,b]=S.bal,score=a>b?1:a===b?.5:0,opp=BOTS[S.bot];
 const exp=1/(1+Math.pow(10,(opp.elo-P.rating)/400)),K=P.games<10?48:32;
 const d=Math.round(K*(score-exp));P.rating=Math.max(100,P.rating+d);P.peak=Math.max(P.peak,P.rating);S.ratingDelta=d;
 P.games++;if(score===1){P.wins++;P.mstreak++;P.bestMStreak=Math.max(P.bestMStreak,P.mstreak);unlock('first');if(S.bot==='zor')unlock('hard');if(P.mstreak>=3)unlock('m3');}else P.mstreak=0;
 if(P.rating>=1250)unlock('gold');if(P.rating>=1650)unlock('dia');
 addLB(a,'🤖 '+opp.n+' ('+opp.lv+')');ST.save();
}

let rzT;window.addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(()=>{if(['intro','result'].includes(S.screen))render();},200);});
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
</script>
